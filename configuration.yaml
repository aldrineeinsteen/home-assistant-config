# Loads default set of integrations. Do not remove.
default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.100.99

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

input_number:
  heating_target_ground_floor:
    name: Heating Target Ground Floor
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"

  heating_target_first_floor:
    name: Heating Target First Floor
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"

  heating_target_chris_room:
    name: Heating Target Chris Room
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"

  heating_outside_cutoff:
    name: Heating Outside Cutoff
    min: 10
    max: 22
    step: 0.5
    unit_of_measurement: "°C"

  heating_freezing_cutoff:
    name: Heating Freezing Cutoff
    min: 2
    max: 7
    step: 0.5
    unit_of_measurement: "°C"

template:
  - binary_sensor:
      - name: "Anyone Home"
        unique_id: anyone_home
        state: >
          {{
            is_state('person.aldrine_einsteen', 'home')
            or is_state('person.evangeline_aldrine', 'home')
          }}

      - name: "Outside Warm Enough For Heating Off"
        unique_id: outside_warm_enough_for_heating_off
        state: >
          {% set outside_temp = state_attr('weather.forecast_home', 'temperature') %}
          {{ outside_temp is not none and outside_temp | float >= states('input_number.heating_outside_cutoff') | float }}

  - sensor:
      - name: "First Floor Avg Temperature"
        unique_id: first_floor_avg_temperature
        unit_of_measurement: "°C"
        state: >
          {% set temps = [
            state_attr('climate.radiator_valve_1', 'current_temperature'),
            state_attr('climate.radiator_valve_1_2', 'current_temperature')
          ] %}
          {% set valid = temps | select('number') | list %}
          {% if valid | count > 0 %}
            {{ (valid | sum / valid | count) | round(1) }}
          {% else %}
            unknown
          {% endif %}

      - name: "Hive Restart Last Run Minutes"
        unique_id: hive_restart_last_run_minutes
        unit_of_measurement: "min"
        state: >
          {% set last = state_attr('automation.restart', 'last_triggered') %}
          {% if last %}
            {{ ((as_timestamp(now()) - as_timestamp(last)) / 60) | round(0) }}
          {% else %}
            unknown
          {% endif %}
  - binary_sensor:
      - name: "Seed Rack Lights Should Be On"
        unique_id: seed_rack_lights_should_be_on
        state: >
          {{ now().strftime('%H:%M:%S') >= '07:00:00' and now().strftime('%H:%M:%S') < '20:00:00' }}

      - name: "Seed Rack Lights In Sync"
        unique_id: seed_rack_lights_in_sync
        state: >
          {% set should_be_on = now().strftime('%H:%M:%S') >= '07:00:00' and now().strftime('%H:%M:%S') < '20:00:00' %}
          {% set top_on = is_state('switch.top_lights_seed_rack_socket_1', 'on') %}
          {% set bottom_on = is_state('switch.bottom_lights_seed_rack_socket_1', 'on') %}
          {% if should_be_on %}
            {{ top_on and bottom_on }}
          {% else %}
            {{ not top_on and not bottom_on }}
          {% endif %}

      - name: "Hive Control Available"
        unique_id: hive_control_available
        state: >
          {{ states('climate.hive_control') not in ['unavailable', 'unknown'] }}

  - sensor:
      - name: "Outside Temperature"
        unique_id: outside_temperature
        unit_of_measurement: "°C"
        state: >
          {{ state_attr('weather.forecast_home', 'temperature') }}

  - sensor:
      - name: "Electricity Unit Rate"
        unit_of_measurement: "£/kWh"
        state: 0.2058

      - name: "Electricity Standing Charge Daily"
        unit_of_measurement: "£"
        state: 0.4728

      - name: "Gas Unit Rate"
        unit_of_measurement: "£/kWh"
        state: 0.0541

      - name: "Gas Standing Charge Daily"
        unit_of_measurement: "£"
        state: 0.311

      - name: "Electricity Standing Charge Monthly"
        unit_of_measurement: "£"
        state: "{{ (0.4728 * 30) | round(2) }}"

      - name: "Gas Standing Charge Monthly"
        unit_of_measurement: "£"
        state: "{{ (0.311 * 30) | round(2) }}"

  - sensor:
      - name: Ground Floor Avg Temperature
        unique_id: ground_floor_avg_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{
            (
              states('sensor.radiator_valve_1_current_temperature_3') | float(0)
            ) | round(1)
          }}

group:
  family:
    name: Family
    entities:
      - person.aldrine_einsteen
      - person.evangeline_aldrine
      - person.chris_aldrine
      - person.keona_aldrine
