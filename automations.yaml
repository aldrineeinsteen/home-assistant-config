- id: seed_rack_lights_failsafe
  alias: seed-rack-light-failsafe
  triggers:
  - minutes: /5
    trigger: time_pattern
  actions:
  - choose:
    - conditions:
      - condition: time
        after: 07:00:00
        before: '20:00:00'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.top_lights_seed_rack_socket_1
          state: 'off'
        - condition: state
          entity_id: switch.bottom_lights_seed_rack_socket_1
          state: 'off'
      sequence:
      - target:
          entity_id:
          - switch.top_lights_seed_rack_socket_1
          - switch.bottom_lights_seed_rack_socket_1
        action: switch.turn_on
    - conditions:
      - condition: or
        conditions:
        - condition: time
          before: 07:00:00
        - condition: time
          after: '20:00:00'
      - condition: or
        conditions:
        - condition: state
          entity_id: switch.top_lights_seed_rack_socket_1
          state: 'on'
        - condition: state
          entity_id: switch.bottom_lights_seed_rack_socket_1
          state: 'on'
      sequence:
      - target:
          entity_id:
          - switch.top_lights_seed_rack_socket_1
          - switch.bottom_lights_seed_rack_socket_1
        action: switch.turn_off
  mode: single
- id: '1774201134936'
  alias: Restart Hive Hub
  triggers:
  - at: 04:00:00
    trigger: time
  actions:
  - data:
      level: warning
      message: Hive restart automation started
    action: system_log.write
  - target:
      entity_id: switch.smart_plug_mini_4
    action: switch.turn_off
  - wait_template: '{{ is_state(''switch.smart_plug_mini_4'', ''off'') }}'
    timeout: 00:00:20
    continue_on_timeout: true
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - target:
      entity_id: switch.smart_plug_mini_4
    action: switch.turn_on
  - wait_template: '{{ is_state(''switch.smart_plug_mini_4'', ''on'') }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not is_state(''switch.smart_plug_mini_4'', ''on'') }}'
      sequence:
      - data:
          title: Hive Hub restart failed
          message: The smart plug did not come back on after restart automation.
        action: persistent_notification.create
  - data:
      level: warning
      message: Hive restart automation completed
    action: system_log.write
  mode: single
- id: ring_motion_mode_manager
  alias: Ring Motion Mode Manager
  description: Manage Ring motion alerts based on home presence and time
  trigger:
  - platform: state
    entity_id: binary_sensor.anyone_home
  - platform: time
    at: 05:00:00
  - platform: time
    at: '21:00:00'
  - platform: homeassistant
    event: start
  condition: []
  action:
  - variables:
      anyone_home: '{{ is_state(''binary_sensor.anyone_home'', ''on'') }}'
      is_daytime: '{{ now().strftime(''%H:%M:%S'') >= ''05:00:00'' and now().strftime(''%H:%M:%S'')
        < ''21:00:00'' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not anyone_home }}'
      sequence:
      - service: switch.turn_on
        target:
          entity_id:
          - switch.front_door_motion_detection
          - switch.garden_motion_detection
      - service: system_log.write
        data:
          level: info
          message: '[Ring Motion Mode Manager] Away mode active. Front Door Motion=on,
            Garden Motion=on

            '
    - conditions:
      - condition: template
        value_template: '{{ anyone_home and is_daytime }}'
      sequence:
      - service: switch.turn_on
        target:
          entity_id:
          - switch.front_door_motion_detection
      - service: switch.turn_off
        target:
          entity_id:
          - switch.garden_motion_detection
      - service: system_log.write
        data:
          level: info
          message: '[Ring Motion Mode Manager] Home daytime mode active. Front Door
            Motion=on, Garden Motion=off

            '
    - conditions:
      - condition: template
        value_template: '{{ anyone_home and not is_daytime }}'
      sequence:
      - service: switch.turn_on
        target:
          entity_id:
          - switch.front_door_motion_detection
          - switch.garden_motion_detection
      - service: system_log.write
        data:
          level: info
          message: '[Ring Motion Mode Manager] Home night mode active. Front Door
            Motion=on, Garden Motion=on

            '
  mode: single
- alias: Heating Zone Policy Manager
  id: heating_zone_policy_manager
  mode: restart
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.anyone_home
        - binary_sensor.outside_warm_enough_for_heating_off
        - binary_sensor.hive_control_available
        - sensor.heating_effective_mode
        - sensor.ground_floor_avg_temperature
        - sensor.first_floor_avg_temperature
        - sensor.chris_room_temperature
        - schedule.heating_weekly_mode
    - platform: state
      entity_id:
        - input_number.heating_target_ground_floor
        - input_number.heating_target_first_floor
        - input_number.heating_target_chris_room
        - input_number.heating_outside_cutoff
        - input_number.heating_freezing_cutoff
        - input_number.heating_away_setback_target
        - input_number.heating_on_margin
        - input_number.heating_boost_target
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/15"

  variables:
    anyone_home: "{{ is_state('binary_sensor.anyone_home', 'on') }}"
    effective_mode: "{{ states('sensor.heating_effective_mode') }}"
    effective_mode_valid: >
      {{
        effective_mode in ['Home', 'Sleep', 'Away', 'Holiday', 'Boost', 'Off']
      }}
    hive_available: "{{ is_state('binary_sensor.hive_control_available', 'on') }}"
    outside_temp: "{{ states('sensor.outside_temperature') }}"
    outside_temp_valid: "{{ is_number(outside_temp) }}"
    outside_warm: >
      {{
        outside_temp_valid
        and is_state('binary_sensor.outside_warm_enough_for_heating_off', 'on')
      }}
    freezing_cutoff: "{{ states('input_number.heating_freezing_cutoff') | float(6) }}"
    frost_protection_active: >
      {{
        outside_temp_valid
        and outside_temp | float <= freezing_cutoff | float
      }}

    ground_floor_temp: "{{ states('sensor.ground_floor_avg_temperature') }}"
    first_floor_temp: "{{ states('sensor.first_floor_avg_temperature') }}"
    chris_temp: "{{ states('sensor.chris_room_temperature') }}"

    ground_floor_temp_valid: "{{ is_number(ground_floor_temp) }}"
    first_floor_temp_valid: "{{ is_number(first_floor_temp) }}"
    chris_temp_valid: "{{ is_number(chris_temp) }}"
    indoor_temperature_available: >
      {{
        ground_floor_temp_valid
        or first_floor_temp_valid
        or chris_temp_valid
      }}
    invalid_zones: >
      {% set zones = [] %}
      {% if not ground_floor_temp_valid %}
        {% set zones = zones + ['ground_floor'] %}
      {% endif %}
      {% if not first_floor_temp_valid %}
        {% set zones = zones + ['first_floor'] %}
      {% endif %}
      {% if not chris_temp_valid %}
        {% set zones = zones + ['chris_room'] %}
      {% endif %}
      {{ zones | join(', ') if zones | count > 0 else 'none' }}

    schedule_target: >
      {{ state_attr('schedule.heating_weekly_mode', 'target') }}
    schedule_target_valid: >
      {{
        is_state('schedule.heating_weekly_mode', 'on')
        and is_number(schedule_target)
      }}
    ground_floor_base_target: >
      {{ states('input_number.heating_target_ground_floor') | float(20) }}
    first_floor_base_target: >
      {{ states('input_number.heating_target_first_floor') | float(20) }}
    chris_base_target: >
      {{ states('input_number.heating_target_chris_room') | float(20) }}
    ground_floor_target: >
      {{
        [[schedule_target | float, 15] | max, 24] | min
        if schedule_target_valid and effective_mode in ['Home', 'Sleep']
        else ground_floor_base_target
      }}
    first_floor_target: >
      {{
        [[schedule_target | float, 15] | max, 24] | min
        if schedule_target_valid and effective_mode in ['Home', 'Sleep']
        else first_floor_base_target
      }}
    chris_target: >
      {{
        [[schedule_target | float, 15] | max, 24] | min
        if schedule_target_valid and effective_mode in ['Home', 'Sleep']
        else chris_base_target
      }}

    setback_target: >
      {{ states('input_number.heating_away_setback_target') | float(12) }}
    heating_on_margin: >
      {{ states('input_number.heating_on_margin') | float(0.3) }}
    boost_target: >
      {{ states('input_number.heating_boost_target') | float(22) }}
    normal_heating_allowed: >
      {{ effective_mode in ['Home', 'Sleep'] }}

    ground_floor_needs_heat: >
      {{
        ground_floor_temp_valid
        and normal_heating_allowed
        and ground_floor_temp | float
          < (ground_floor_target - heating_on_margin)
      }}

    first_floor_needs_heat: >
      {{
        first_floor_temp_valid
        and normal_heating_allowed
        and first_floor_temp | float
          < (first_floor_target - heating_on_margin)
      }}

    chris_needs_heat: >
      {{
        chris_temp_valid
        and normal_heating_allowed
        and chris_temp | float < (chris_target - heating_on_margin)
      }}

    any_zone_needs_heat: >
      {{ ground_floor_needs_heat or first_floor_needs_heat or chris_needs_heat }}

    hvac_mode: >
      {% if frost_protection_active %}
        heat
      {% elif not effective_mode_valid %}
        skip
      {% elif not indoor_temperature_available %}
        skip
      {% elif effective_mode in ['Away', 'Holiday', 'Off'] %}
        off
      {% elif effective_mode == 'Boost' %}
        heat
      {% elif outside_warm %}
        off
      {% elif any_zone_needs_heat %}
        heat
      {% else %}
        off
      {% endif %}

    desired_temp: >
      {% if hvac_mode == 'heat' %}
        {% if frost_protection_active
          and (
            effective_mode in ['Away', 'Holiday', 'Off']
            or not indoor_temperature_available
          ) %}
          {{ setback_target }}
        {% elif effective_mode == 'Boost' %}
          {{ boost_target }}
        {% else %}
          {{ [ground_floor_target, first_floor_target, chris_target] | max }}
        {% endif %}
      {% else %}
        0
      {% endif %}

    active_zones: >
      {% set zones = [] %}
      {% if ground_floor_needs_heat %}{% set zones = zones + ['ground_floor'] %}{% endif %}
      {% if first_floor_needs_heat %}{% set zones = zones + ['first_floor'] %}{% endif %}
      {% if chris_needs_heat %}{% set zones = zones + ['chris_room'] %}{% endif %}
      {{ zones | join(', ') if zones | count > 0 else 'none' }}

    policy_mode: >
      {% if hvac_mode == 'skip' %}
        sensor_failure
      {% elif frost_protection_active
        and (
          effective_mode in ['Away', 'Holiday', 'Off']
          or not indoor_temperature_available
        ) %}
        frost_protection
      {% elif effective_mode == 'Boost' and hvac_mode == 'heat' %}
        boost
      {% elif hvac_mode == 'off' %}
        off
      {% else %}
        zone_heating
      {% endif %}

  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not indoor_temperature_available }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{
                          not has_value(
                            'persistent_notification.heating_indoor_temperature_unavailable'
                          )
                        }}
                  sequence:
                    - service: persistent_notification.create
                      data:
                        notification_id: heating_indoor_temperature_unavailable
                        title: Heating indoor temperatures unavailable
                        message: >
                          Ground floor, first floor, and Chris room temperature
                          sources are unavailable. Normal zone control is paused.
                          Frost protection remains active only when the outside
                          temperature is valid and at or below the freezing cutoff.
                          Outside temperature={{ outside_temp }},
                          frost protection={{ frost_protection_active }}.
        - conditions:
            - condition: template
              value_template: >
                {{
                  indoor_temperature_available
                  and has_value(
                    'persistent_notification.heating_indoor_temperature_unavailable'
                  )
                }}
          sequence:
            - service: persistent_notification.dismiss
              data:
                notification_id: heating_indoor_temperature_unavailable

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not outside_temp_valid }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{
                          not has_value(
                            'persistent_notification.heating_outside_temperature_unavailable'
                          )
                        }}
                  sequence:
                    - service: persistent_notification.create
                      data:
                        notification_id: heating_outside_temperature_unavailable
                        title: Heating outside temperature unavailable
                        message: >
                          The weather-based outside temperature is unavailable.
                          Warm-weather shutoff and frost detection are suspended;
                          valid indoor zones continue normal temperature control.
        - conditions:
            - condition: template
              value_template: >
                {{
                  outside_temp_valid
                  and has_value(
                    'persistent_notification.heating_outside_temperature_unavailable'
                  )
                }}
          sequence:
            - service: persistent_notification.dismiss
              data:
                notification_id: heating_outside_temperature_unavailable

    - service: system_log.write
      data:
        level: warning
        message: >
          Heating Zone Policy triggered.
          mode={{ policy_mode }},
          hvac_mode={{ hvac_mode }},
          effective_mode={{ effective_mode }},
          effective_mode_valid={{ effective_mode_valid }},
          anyone_home={{ anyone_home }},
          outside_temp={{ outside_temp }},
          freezing_cutoff={{ freezing_cutoff }},
          heating_on_margin={{ heating_on_margin }},
          schedule_target={{ schedule_target }},
          boost_target={{ boost_target }},
          hive_available={{ hive_available }},
          desired_temp={{ desired_temp }},
          active_zones={{ active_zones }},
          invalid_zones={{ invalid_zones }},
          ground_floor_temp={{ ground_floor_temp }},
          ground_floor_target={{ ground_floor_target }},
          first_floor_temp={{ first_floor_temp }},
          first_floor_target={{ first_floor_target }},
          chris_temp={{ chris_temp }},
          chris_target={{ chris_target }}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ hvac_mode == 'skip' }}"
          sequence:
            - stop: Heating mode or indoor temperature sources are unavailable

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not hive_available }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: Heating Policy Skipped
                message: >
                  Hive control unavailable.
                  mode={{ policy_mode }},
                  desired_temp={{ desired_temp }},
                  active_zones={{ active_zones }}
            - stop: Hive unavailable

    - repeat:
        count: 2
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.hive_control
            data:
              hvac_mode: "{{ hvac_mode }}"
            continue_on_error: true

          - delay: "00:00:05"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_mode == 'heat' }}"
                sequence:
                  - service: climate.set_temperature
                    target:
                      entity_id: climate.hive_control
                    data:
                      temperature: "{{ desired_temp }}"
                    continue_on_error: true

          - delay: "00:00:10"

    - service: system_log.write
      data:
        level: warning
        message: >
          Heating Zone Policy completed.
          mode={{ policy_mode }},
          effective_mode={{ effective_mode }},
          hvac_mode={{ hvac_mode }},
          active_zones={{ active_zones }},
          climate_state={{ states('climate.hive_control') }},
          target_now={{ state_attr('climate.hive_control', 'temperature') }}

    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ hvac_mode == 'heat' and
                   (state_attr('climate.hive_control', 'temperature') | float(-999)) != (desired_temp | float) }}
          sequence:
            - service: persistent_notification.create
              data:
                title: Heating Policy Warning
                message: >
                  Hive may not have accepted the target.
                  mode={{ policy_mode }},
                  expected={{ desired_temp }},
                  actual={{ state_attr('climate.hive_control', 'temperature') }},
                  state={{ states('climate.hive_control') }},
                  active_zones={{ active_zones }}

- alias: Chris Room TRV Manager
  id: chris_room_trv_manager
  mode: restart
  trigger:
    - platform: state
      entity_id:
        - input_number.heating_target_chris_room
        - input_number.heating_chris_room_frost_target
        - input_number.heating_boost_target
        - sensor.chris_room_temperature
        - binary_sensor.anyone_home
        - sensor.heating_effective_mode
        - schedule.heating_weekly_mode
    - platform: homeassistant
      event: start
    - platform: time_pattern
      minutes: "/10"

  variables:
    anyone_home: "{{ is_state('binary_sensor.anyone_home', 'on') }}"
    effective_mode: "{{ states('sensor.heating_effective_mode') }}"
    effective_mode_valid: >
      {{
        effective_mode in ['Home', 'Sleep', 'Away', 'Holiday', 'Boost', 'Off']
      }}
    schedule_target: >
      {{ state_attr('schedule.heating_weekly_mode', 'target') }}
    schedule_target_valid: >
      {{
        is_state('schedule.heating_weekly_mode', 'on')
        and is_number(schedule_target)
      }}
    chris_base_target: >
      {{ states('input_number.heating_target_chris_room') | float(20) }}
    chris_target: >
      {{
        [[schedule_target | float, 15] | max, 24] | min
        if schedule_target_valid and effective_mode in ['Home', 'Sleep']
        else chris_base_target
      }}
    frost_target: >
      {{ states('input_number.heating_chris_room_frost_target') | float(8) }}
    boost_target: >
      {{ states('input_number.heating_boost_target') | float(22) }}
    trv_target: >
      {% if effective_mode == 'Boost' %}
        {{ boost_target }}
      {% elif effective_mode in ['Home', 'Sleep'] %}
        {{ chris_target }}
      {% else %}
        {{ frost_target }}
      {% endif %}

  action:
    - condition: template
      value_template: "{{ effective_mode_valid }}"

    - service: climate.set_temperature
      target:
        entity_id: climate.chris_room_trv
      data:
        temperature: "{{ trv_target }}"

    - service: system_log.write
      data:
        level: warning
        message: >
          Chris Room TRV updated.
          anyone_home={{ anyone_home }},
          effective_mode={{ effective_mode }},
          trv_target={{ trv_target }},
          current_temp={{ states('sensor.chris_room_temperature') }}
