title: Local Services
views:
  - title: Network
    path: network
    icon: mdi:lan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: DNS Filtering
            icon: mdi:shield-check
          - type: entities
            title: Pi-hole
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.pi_hole_health
                name: Service Health
              - entity: sensor.pi_hole_docker_health
                name: Docker Health
              - entity: binary_sensor.network_services_raspberry_pi
                name: Host Reachable
              - entity: switch.pi_hole
                name: DNS Filtering
              - entity: sensor.pi_hole_dns_queries
                name: DNS Queries
              - entity: sensor.pi_hole_ads_percentage_blocked
                name: Blocked
              - entity: sensor.pi_hole_dns_unique_clients
                name: Unique Clients
              - type: section
                label: Updates
              - entity: update.pi_hole_core_update_available
                name: Pi-hole Core
              - entity: update.pi_hole_ftl_update_available
                name: FTL
              - entity: update.pi_hole_web_update_available
                name: Web Interface
      - type: grid
        cards:
          - type: heading
            heading: Remote Access
            icon: mdi:vpn
          - type: entities
            title: WireGuard
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.wireguard_health
                name: Service Health
              - entity: sensor.wireguard_docker_health
                name: Docker Health
              - entity: binary_sensor.network_services_raspberry_pi
                name: Host Reachable
              - entity: sensor.wireguard_interface_status
                name: Interface
              - entity: sensor.wireguard_peer_status
                name: Peers
              - entity: sensor.wireguard_handshake_status
                name: Latest Handshake
              - type: attribute
                entity: sensor.wireguard_traffic
                attribute: received
                name: Received
                icon: mdi:download-network
              - type: attribute
                entity: sensor.wireguard_traffic
                attribute: sent
                name: Sent
                icon: mdi:upload-network
              - entity: sensor.wireguard_telemetry_status
                name: Telemetry Updated
      - type: grid
        cards:
          - type: heading
            heading: Router
            icon: mdi:router-wireless
          - type: entities
            title: ASUS GT-BE98
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.asus_router_health
                name: Router Health
              - entity: binary_sensor.asus_gt_be98_router
                name: Router Reachable
          - type: button
            name: Open Router Syslog
            icon: mdi:text-box-search-outline
            show_state: false
            tap_action:
              action: url
              url_path: https://ha.lan/app/local_bounded_router_syslog
  - title: Heating
    path: heating
    icon: mdi:radiator
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Hive Hub
            icon: mdi:hub
          - type: entities
            title: Hive Hub Health
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.hive_hub_health
                name: Service Health
              - entity: binary_sensor.hive_hub_hive_hub_status
                name: Hive Cloud Connected
              - entity: climate.hive_control
                name: Physical Bridge Control
              - entity: binary_sensor.hive_control_available
                name: Physical Bridge Available
              - entity: switch.smart_plug_mini_4
                name: Hub Power
              - entity: sensor.smart_plug_mini_power_4
                name: Hub Plug Load
              - entity: sensor.hive_restart_last_run_minutes
                name: Minutes Since Last Restart
              - entity: automation.hive_hub_recover_when_unhealthy
                name: Automatic Recovery
              - entity: script.hive_hub_restart
                name: Restart Hub Now
  - title: Bambu P1S
    path: bambu-p1s
    icon: mdi:printer-3d
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bambu P1S
            icon: mdi:printer-3d
          - type: entities
            title: Print Status
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.p1s_01p00c481000248_print_status
                name: Print Status
              - entity: sensor.p1s_01p00c481000248_current_stage
                name: Current Stage
              - entity: sensor.p1s_01p00c481000248_print_progress
                name: Progress
              - entity: sensor.p1s_01p00c481000248_remaining_time
                name: Remaining Time
              - entity: sensor.p1s_01p00c481000248_nozzle_temperature
                name: Nozzle Temperature
              - entity: sensor.p1s_01p00c481000248_bed_temperature
                name: Bed Temperature
              - entity: sensor.p1s_01p00c481000248_active_tray
                name: Active Tray
      - type: grid
        cards:
          - type: heading
            heading: Print Controls
            icon: mdi:printer-3d-nozzle
          - type: entities
            title: Printer Controls
            show_header_toggle: false
            state_color: true
            entities:
              - entity: number.p1s_01p00c481000248_nozzle_target_temperature
                name: Nozzle Target
              - entity: number.p1s_01p00c481000248_bed_target_temperature
                name: Bed Target
              - entity: select.p1s_01p00c481000248_printing_speed
                name: Printing Speed
              - entity: switch.p1s_01p00c481000248_chamber_light
                name: Chamber Light
              - entity: switch.p1s_01p00c481000248_camera
                name: Camera
          - type: entities
            title: Power
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.bambu_p1s_socket_1
                name: Printer Power
  - title: Services
    path: services
    icon: mdi:server-network
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Home Assistant
            icon: mdi:home-assistant
          - type: entities
            title: System Monitor
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.system_monitor_processor_temperature
                name: CPU Temperature
              - entity: sensor.system_monitor_processor_use
                name: CPU Utilisation
      - type: grid
        cards:
          - type: heading
            heading: Storage
            icon: mdi:nas
          - type: entities
            title: OpenMediaVault
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.omv_storage_health
                name: Storage Health
              - entity: sensor.omv_filesystem_md0
                name: Data Used
              - entity: sensor.omv_data_available
                name: Data Available
          - type: entities
            title: OpenMediaVault System Status
            show_header_toggle: false
            state_color: true
            entities:
              - entity: binary_sensor.omv_system_update_available
                name: Package Updates Available
              - entity: binary_sensor.omv_system_reboot_pending
                name: Reboot Pending
              - entity: binary_sensor.omv_system_config_dirty
                name: Configuration Dirty
              - entity: update.openmediavault_update
                name: Integration Update
      - type: grid
        cards:
          - type: heading
            heading: Media
            icon: mdi:play-network
          - type: entities
            title: Jellyfin
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.jellyfin_health
                name: Service Health
              - entity: sensor.jellyfin_runtime
                name: Runtime Health
              - entity: binary_sensor.jellyfin_raspberry_pi
                name: Host Reachable
              - entity: sensor.jellyfin_version
                name: Version
              - type: attribute
                entity: sensor.jellyfin_version
                attribute: ServerName
                name: Server
                icon: mdi:server
              - type: attribute
                entity: sensor.jellyfin_version
                attribute: LocalAddress
                name: Backend
                icon: mdi:ip-network
