          - entity: sensor.ground_floor_avg_temperature
            name: Ground Floor Avg
      - type: history-graph
        title: Ground Floor TRV Temperatures
        hours_to_show: 24
        entities:
          - entity: sensor.heating_utility_room_current_temperature
            name: Utility Room TRV
          - entity: sensor.heating_dining_room_current_temperature
