          - entity: event.octopus_energy_gas_e6e12701832423_7436504601_next_day_rates
            name: Next Day Rates
          - entity: >-
              event.octopus_energy_gas_e6e12701832423_7436504601_previous_day_rates
            name: Previous Day Rates
  - title: Ground Floor
    path: ground-floor
    icon: mdi:floor-plan
    theme: Backend-selected
    cards:
