views:
  - title: Devices
    path: devices
    icon: mdi:power-plug
    theme: Backend-selected
    cards:
      - type: heading
        heading: Quick Controls
        icon: mdi:flash
      - type: horizontal-stack
        cards:
          - type: button
            entity: switch.smart_plug_mini_4
            name: Hive Hub
            icon: mdi:router-wireless
            tap_action:
              action: toggle
          - type: button
            entity: switch.smart_plug_mini
            name: Window Lights A
            icon: mdi:string-lights
            tap_action:
              action: toggle
          - type: button
            entity: switch.smart_plug_mini_2
            name: Window Lights B
            icon: mdi:string-lights
            tap_action:
              action: toggle
      - type: heading
        heading: Grow Setup
        icon: mdi:sprout
      - type: entities
        title: Grow Equipment
        show_header_toggle: false
        entities:
          - entity: switch.top_lights_seed_rack_socket_1
            name: Grow Lights Top Rack
          - entity: switch.bottom_lights_seed_rack_socket_1
            name: Grow Lights Bottom Rack
          - entity: switch.heated_propagator_socket_1
            name: Heated Propagator
      - type: heading
        heading: Christmas Lights
        icon: mdi:pine-tree
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.smart_plug_mini
            name: Window Lights A
          - entity: switch.smart_plug_mini_2
            name: Window Lights B
      - type: heading
        heading: Garden and Outdoor
        icon: mdi:tree
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.wifi_smart_switch_switch_1
            name: Front Garden Switch 1
          - entity: switch.wifi_smart_switch_switch_2
            name: Front Garden Switch 2
      - type: heading
        heading: Smart Plugs
        icon: mdi:power-socket-uk
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.spare_socket_socket_1
            name: Spare Socket
          - entity: switch.bambu_p1s_socket_1
            name: Bambu P1S
      - type: heading
        heading: Ring Volume
        icon: mdi:volume-high
      - type: entities
        title: Ring Speakers
        show_header_toggle: false
        entities:
          - entity: number.front_door_volume
            name: Front Door Volume
          - entity: number.garden_volume
            name: Garden Volume
          - entity: number.kitchen_volume
            name: Kitchen Volume
          - entity: number.master_bedroom_volume
            name: Master Bedroom Volume
          - entity: number.upstairs_volume
            name: Upstairs Volume
      - type: heading
        heading: Security and Detection
        icon: mdi:shield-home
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_boolean.garden_automation_enabled
            name: Garden Motion Automation
          - entity: switch.front_door_motion_detection
            name: Front Door Motion
          - entity: switch.front_door_in_home_chime
            name: Door Chime
          - entity: switch.garden_motion_detection
            name: Garden Motion
          - entity: input_select.garden_motion_pause_duration
            name: Garden Pause Duration
          - entity: timer.garden_motion_pause
            name: Garden Motion Pause
          - entity: script.garden_pause_motion
            name: Pause Garden Motion
          - entity: script.garden_resume_motion
            name: Resume Garden Motion Now
      - type: heading
        heading: Unavailable Devices
        icon: mdi:alert-circle-outline
      - type: conditional
        conditions:
          - entity: switch.smart_plug_mini_3
            state: unavailable
        card:
          type: entities
          show_header_toggle: false
          entities:
            - entity: switch.smart_plug_mini_3
              name: Christmas Lights C
      - type: heading
        heading: Infrastructure and Services
        icon: mdi:server-network
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.omv_storage_health
            name: Storage Health
          - entity: sensor.omv_filesystem_md0
            name: Data Used
          - entity: sensor.omv_data_available
            name: Data Available
          - type: attribute
            entity: sensor.omv_filesystem_md0
            attribute: mounted
            name: Filesystem Mounted
            icon: mdi:harddisk
          - type: attribute
            entity: sensor.omv_filesystem_md0
            attribute: _readonly
            name: Filesystem Read-only
            icon: mdi:lock-outline
          - type: section
            label: Disk Temperatures
          - entity: sensor.omv_disk_sda
            name: Disk sda
          - entity: sensor.omv_disk_sdb
            name: Disk sdb
          - entity: sensor.omv_disk_sdc
            name: Disk sdc
          - entity: sensor.omv_disk_sdd
            name: Disk sdd
          - entity: sensor.omv_disk_sde
            name: Disk sde
          - type: section
            label: System Status
          - entity: binary_sensor.omv_system_update_available
            name: Package Updates Available
          - entity: binary_sensor.omv_system_reboot_pending
            name: Reboot Pending
          - entity: binary_sensor.omv_system_config_dirty
            name: Configuration Dirty
          - entity: update.openmediavault_update
            name: Integration Update
        title: OpenMediaVault
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.jellyfin_health
            name: Service Health
          - entity: sensor.jellyfin_pi_health
            name: Raspberry Pi Health
          - entity: binary_sensor.jellyfin_raspberry_pi
            name: Host Reachable
          - entity: sensor.jellyfin_version
            name: Version
          - type: attribute
            entity: sensor.jellyfin_version
            attribute: ServerName
            name: Server
            icon: mdi:server
          - type: attribute
            entity: sensor.jellyfin_version
            attribute: LocalAddress
            name: Backend
            icon: mdi:ip-network
        title: Jellyfin
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.pi_hole_health
            name: Service Health
          - entity: sensor.network_services_pi_health
            name: Raspberry Pi Health
          - entity: switch.pi_hole
            name: DNS Filtering
          - entity: sensor.pi_hole_dns_queries
            name: DNS Queries
          - entity: sensor.pi_hole_ads_percentage_blocked
            name: Blocked
          - entity: sensor.pi_hole_dns_unique_clients
            name: Unique Clients
          - type: section
            label: Updates
          - entity: update.pi_hole_core_update_available
            name: Pi-hole Core
          - entity: update.pi_hole_ftl_update_available
            name: FTL
          - entity: update.pi_hole_web_update_available
            name: Web Interface
        title: Pi-hole
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.wireguard_health
            name: Service Health
          - entity: sensor.network_services_pi_health
            name: Raspberry Pi Health
          - entity: binary_sensor.wireguard_container_running
            name: Container
          - entity: sensor.wireguard_interface
            name: Interface
          - entity: sensor.wireguard_peers
            name: Peers
          - entity: sensor.wireguard_latest_handshake_age
            name: Latest Handshake Age
          - entity: sensor.wireguard_received
            name: Received
          - entity: sensor.wireguard_sent
            name: Sent
          - entity: sensor.wireguard_telemetry_updated
            name: Telemetry Updated
        title: WireGuard
      - type: entities
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.asus_router_health
            name: Router Health
          - entity: binary_sensor.asus_gt_be98_router
            name: Router Reachable
        title: ASUS GT-BE98 Router
