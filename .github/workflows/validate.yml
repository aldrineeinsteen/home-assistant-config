name: Validate configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check yamllint==1.38.0

      - name: Validate YAML files
        run: yamllint --config-file .yamllint .

      - name: Reject sensitive Home Assistant files
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.storage/|home-assistant_v2\.db|home-assistant\.log|\.omv_cookies\.json)' || true)
          if [[ -n "$forbidden" ]]; then
            echo "Sensitive or generated Home Assistant files are tracked:"
            echo "$forbidden"
            exit 1
          fi
