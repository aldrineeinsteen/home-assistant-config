input_select:
  garden_motion_pause_duration:
    name: Garden Motion Pause Duration
    options:
      - "30 minutes"
      - "60 minutes"
      - "120 minutes"
    initial: "30 minutes"
    icon: mdi:timer-cog-outline

input_boolean:
  garden_automation_enabled:
    name: Garden Motion Automation
    icon: mdi:motion-sensor

  garden_manual_light_15m:
    name: Garden Light Manual 15m
    icon: mdi:light-flood-up

timer:
  garden_motion_pause:
    name: Garden Motion Pause
    duration: "00:30:00"
    restore: true
    icon: mdi:motion-sensor-off

  garden_manual_light_15m:
    name: Garden Light Manual Timer
    duration: "00:15:00"
    restore: true
    icon: mdi:timer-outline

script:
  garden_manual_light_15m_trigger:
    alias: Garden - Manual Light 15m Trigger
    icon: mdi:light-flood-up
    mode: restart
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garden_manual_light_15m
      - action: light.turn_on
        target:
          entity_id: light.garden_light
      - action: timer.start
        target:
          entity_id: timer.garden_manual_light_15m
        data:
          duration: "00:15:00"

  garden_apply_motion_policy:
    alias: Garden - Apply Motion Policy
    icon: mdi:motion-sensor
    mode: restart
    sequence:
      - variables:
          automation_enabled: >-
            {{ is_state('input_boolean.garden_automation_enabled', 'on') }}
          manual_override_active: >-
            {{ is_state('input_boolean.garden_manual_light_15m', 'on') }}
          anyone_home: >-
            {{ is_state('binary_sensor.anyone_home', 'on') }}
          pause_state: "{{ states('timer.garden_motion_pause') }}"
          is_after_sunset: >-
            {{ is_state('sun.sun', 'below_horizon') }}
          motion_should_be_enabled: >
            {{
              automation_enabled
              and pause_state == 'idle'
              and (not anyone_home or is_after_sunset)
            }}
      - if:
          - condition: template
            value_template: >-
              {{ not automation_enabled and pause_state != 'idle' }}
        then:
          - action: timer.cancel
            target:
              entity_id: timer.garden_motion_pause
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ motion_should_be_enabled }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ not manual_override_active }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: light.garden_light
              - action: switch.turn_on
                target:
                  entity_id: switch.garden_motion_detection
        default:
          - action: switch.turn_off
            target:
              entity_id: switch.garden_motion_detection
          - if:
              - condition: template
                value_template: "{{ not manual_override_active }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: light.garden_light

  garden_pause_motion:
    alias: Garden - Pause Motion
    icon: mdi:motion-sensor-off
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.garden_automation_enabled
        state: "on"
      - action: timer.start
        target:
          entity_id: timer.garden_motion_pause
        data:
          duration: >
            {% set durations = {
              '30 minutes': '00:30:00',
              '60 minutes': '01:00:00',
              '120 minutes': '02:00:00'
            } %}
            {{
              durations.get(
                states('input_select.garden_motion_pause_duration'),
                '00:30:00'
              )
            }}
      - action: script.garden_apply_motion_policy

  garden_resume_motion:
    alias: Garden - Resume Motion Now
    icon: mdi:motion-sensor
    mode: restart
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.garden_motion_pause
      - action: script.garden_apply_motion_policy

automation:
  - alias: Garden - Motion Light
    id: garden_motion_light
    description: >
      Turn the Garden floodlight on for two minutes when Ring reports motion
      after sunset. Further motion restarts the two-minute delay.
    mode: restart
    trigger:
      - platform: state
        entity_id: event.garden_motion
    condition:
      - condition: template
        value_template: >
          {{
            as_timestamp(trigger.to_state.state, 0)
            >= as_timestamp(now()) - 30
          }}
      - condition: state
        entity_id: input_boolean.garden_automation_enabled
        state: "on"
      - condition: state
        entity_id: timer.garden_motion_pause
        state: "idle"
      - condition: state
        entity_id: input_boolean.garden_manual_light_15m
        state: "off"
      - condition: template
        value_template: >
          {{ is_state('sun.sun', 'below_horizon') }}
    action:
      - action: light.turn_on
        target:
          entity_id: light.garden_light
      - delay: "00:02:00"
      - action: light.turn_off
        target:
          entity_id: light.garden_light

  - alias: Garden - Manual Light Start
    id: garden_manual_light_start
    description: >
      Turn the garden light on manually and keep it on for 15 minutes.
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.garden_manual_light_15m
        to: "on"
    action:
      - action: light.turn_on
        target:
          entity_id: light.garden_light
      - action: timer.start
        target:
          entity_id: timer.garden_manual_light_15m
        data:
          duration: "00:15:00"

  - alias: Garden - Manual Light Stop
    id: garden_manual_light_stop
    description: >
      Allow manual cancellation before the 15-minute timer finishes.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.garden_manual_light_15m
        to: "off"
    action:
      - action: timer.cancel
        target:
          entity_id: timer.garden_manual_light_15m
      - action: light.turn_off
        target:
          entity_id: light.garden_light

  - alias: Garden - Manual Light Timeout
    id: garden_manual_light_timeout
    description: >
      Turn off the garden light once the manual 15-minute timer completes.
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.garden_manual_light_15m
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garden_manual_light_15m
      - action: light.turn_off
        target:
          entity_id: light.garden_light

  - alias: Garden - Reapply Motion Policy
    id: garden_reapply_motion_policy
    description: >
      Apply the garden motion policy when a pause starts, finishes, or is
      cancelled, when Ring reports the motion switch has changed, or when the
      master control changes. An idle timer restores the normal home/time
      policy only while the master control is enabled.
    mode: restart
    trigger:
      - platform: state
        entity_id: timer.garden_motion_pause
      - platform: state
        entity_id: switch.garden_motion_detection
      - platform: state
        entity_id: input_boolean.garden_automation_enabled
    action:
      - action: script.garden_apply_motion_policy
