rest:
  - resource: https://jellyfin.lan/System/Info/Public
    method: GET
    verify_ssl: false
    timeout: 10
    scan_interval: 60
    sensor:
      - name: "Jellyfin Version"
        unique_id: jellyfin_version
        icon: mdi:jellyfish
        value_template: >
          {{ value_json.Version | default('unknown', true) }}
        json_attributes:
          - ServerName
          - ProductName
          - LocalAddress
          - StartupWizardCompleted

mqtt:
  binary_sensor:
    - name: "WireGuard Container Running"
      unique_id: wireguard_container_running
      device_class: running
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ 'ON' if value_json.container_running | default(false) else 'OFF' }}
      payload_on: "ON"
      payload_off: "OFF"
      expire_after: 180

  sensor:
    - name: "Jellyfin Runtime Health"
      unique_id: jellyfin_runtime_health
      icon: mdi:server
      state_topic: "home/infrastructure/systemd/jellyfin/status"
      value_template: >
        {{ value_json.service_health | default('unknown', true) }}
      expire_after: 180

    - name: "Pi-hole Container Health"
      unique_id: pi_hole_container_health
      icon: mdi:docker
      state_topic: "home/infrastructure/docker/pi_hole/status"
      value_template: >
        {{ value_json.container_health | default('unknown', true) }}
      expire_after: 180

    - name: "WireGuard Container Health"
      unique_id: wireguard_container_health
      icon: mdi:docker
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.container_health | default('unknown', true) }}
      expire_after: 180

    - name: "WireGuard Interface"
      unique_id: wireguard_interface
      icon: mdi:vpn
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.interface_state | default('unknown', true) }}
      expire_after: 180

    - name: "WireGuard Peers"
      unique_id: wireguard_peers
      icon: mdi:account-network
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.peer_count | int(0) }}
      state_class: measurement
      expire_after: 180

    - name: "WireGuard Latest Handshake Age"
      unique_id: wireguard_latest_handshake_age
      icon: mdi:handshake
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.latest_handshake_age | int(0) }}
      device_class: duration
      unit_of_measurement: "s"
      state_class: measurement
      expire_after: 180

    - name: "WireGuard Received"
      unique_id: wireguard_received
      icon: mdi:download-network
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.received_bytes | int(0) }}
      device_class: data_size
      unit_of_measurement: "B"
      state_class: total_increasing
      expire_after: 180

    - name: "WireGuard Sent"
      unique_id: wireguard_sent
      icon: mdi:upload-network
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.sent_bytes | int(0) }}
      device_class: data_size
      unit_of_measurement: "B"
      state_class: total_increasing
      expire_after: 180

    - name: "WireGuard Telemetry Updated"
      unique_id: wireguard_telemetry_updated
      icon: mdi:clock-check-outline
      state_topic: "home/infrastructure/wireguard/status"
      value_template: >
        {{ value_json.updated_at | default('unknown', true) }}
      device_class: timestamp
      expire_after: 180

template:
  - sensor:
      - name: "Jellyfin Health"
        unique_id: jellyfin_health
        icon: mdi:jellyfish
        state: >
          {% set host = states('binary_sensor.jellyfin_raspberry_pi') %}
          {% set version = states('sensor.jellyfin_version') %}
          {% set runtime = states('sensor.jellyfin_runtime_health') %}
          {% set configured =
            state_attr('sensor.jellyfin_version', 'StartupWizardCompleted')
          %}
          {% if host != 'on'
                or version in ['unknown', 'unavailable']
                or runtime in ['unknown', 'unavailable', 'none', ''] %}
            Unavailable
          {% elif runtime != 'healthy' %}
            Runtime problem
          {% elif configured is not true %}
            Configuration problem
          {% else %}
            Healthy
          {% endif %}

      - name: "Jellyfin Runtime"
        unique_id: jellyfin_runtime
        icon: mdi:server
        state: >
          {% set health = states('sensor.jellyfin_runtime_health') %}
          {% if health in ['unknown', 'unavailable', 'none', ''] %}
            Telemetry unavailable
          {% else %}
            {{ health | replace('_', ' ') | title }}
          {% endif %}

      - name: "Pi-hole Health"
        unique_id: pi_hole_health
        icon: mdi:pi-hole
        state: >
          {% set host = states('binary_sensor.network_services_raspberry_pi') %}
          {% set service = states('binary_sensor.pi_hole_status') %}
          {% set filtering = states('switch.pi_hole') %}
          {% set updates = [
            states('update.pi_hole_core_update_available'),
            states('update.pi_hole_ftl_update_available'),
            states('update.pi_hole_web_update_available')
          ] %}
          {% if
            host != 'on'
            or service in ['unknown', 'unavailable']
            or filtering in ['unknown', 'unavailable']
          %}
            Unavailable
          {% elif service != 'on' or filtering != 'on' %}
            Filtering disabled
          {% elif 'on' in updates %}
            Update available
          {% else %}
            Healthy
          {% endif %}

      - name: "Pi-hole Docker Health"
        unique_id: pi_hole_docker_health
        icon: mdi:docker
        state: >
          {% set health = states('sensor.pi_hole_container_health') %}
          {% if health in ['unknown', 'unavailable', 'none', ''] %}
            Telemetry unavailable
          {% else %}
            {{ health | replace('_', ' ') | title }}
          {% endif %}

      - name: "WireGuard Health"
        unique_id: wireguard_health
        icon: mdi:vpn
        state: >
          {% set host = states('binary_sensor.network_services_raspberry_pi') %}
          {% set container =
            states('binary_sensor.wireguard_container_running')
          %}
          {% set container_health =
            states('sensor.wireguard_container_health')
          %}
          {% set interface = states('sensor.wireguard_interface') %}
          {% if host != 'on' %}
            Unavailable
          {% elif container in ['unknown', 'unavailable'] %}
            Telemetry unavailable
          {% elif container != 'on' %}
            Container stopped
          {% elif container_health not in ['healthy', 'running'] %}
            Container unhealthy
          {% elif interface != 'up' %}
            Interface problem
          {% else %}
            Healthy
          {% endif %}
        attributes:
          telemetry_expiry: "180 seconds"

      - name: "WireGuard Docker Health"
        unique_id: wireguard_docker_health
        icon: mdi:docker
        state: >
          {% set running =
            states('binary_sensor.wireguard_container_running')
          %}
          {% set health = states('sensor.wireguard_container_health') %}
          {% if running in ['unknown', 'unavailable'] %}
            Telemetry unavailable
          {% elif running != 'on' %}
            Stopped
          {% elif health in ['unknown', 'unavailable', 'none', ''] %}
            Running
          {% else %}
            {{ health | replace('_', ' ') | title }}
          {% endif %}

      - name: "WireGuard Interface Status"
        unique_id: wireguard_interface_status
        icon: mdi:vpn
        state: >
          {% set interface = states('sensor.wireguard_interface') %}
          {% if interface in ['unknown', 'unavailable', 'none', ''] %}
            Telemetry unavailable
          {% else %}
            {{ interface | replace('_', ' ') | title }}
          {% endif %}

      - name: "WireGuard Peer Status"
        unique_id: wireguard_peer_status
        icon: mdi:account-network
        state: >
          {% set peers = states('sensor.wireguard_peers') %}
          {% if peers in ['unknown', 'unavailable', 'none', ''] %}
            Telemetry unavailable
          {% else %}
            {{ peers }}
          {% endif %}

      - name: "WireGuard Handshake Status"
        unique_id: wireguard_handshake_status
        icon: mdi:handshake
        state: >
          {% set age = states('sensor.wireguard_latest_handshake_age') %}
          {% if age in ['unknown', 'unavailable', 'none', ''] %}
            Telemetry unavailable
          {% elif age | int(-1) < 0 %}
            No handshake
          {% else %}
            {{ age | int }} seconds ago
          {% endif %}

      - name: "WireGuard Traffic"
        unique_id: wireguard_traffic
        icon: mdi:swap-vertical
        state: >
          {% set received = states('sensor.wireguard_received') %}
          {% set sent = states('sensor.wireguard_sent') %}
          {% if
            received in ['unknown', 'unavailable', 'none', '']
            or sent in ['unknown', 'unavailable', 'none', '']
          %}
            Telemetry unavailable
          {% else %}
            Available
          {% endif %}
        attributes:
          received: >
            {% set value = states('sensor.wireguard_received') %}
            {% if value in ['unknown', 'unavailable', 'none', ''] %}
              Telemetry unavailable
            {% else %}
              {{ value | int | filesizeformat }}
            {% endif %}
          sent: >
            {% set value = states('sensor.wireguard_sent') %}
            {% if value in ['unknown', 'unavailable', 'none', ''] %}
              Telemetry unavailable
            {% else %}
              {{ value | int | filesizeformat }}
            {% endif %}

      - name: "WireGuard Telemetry Status"
        unique_id: wireguard_telemetry_status
        icon: mdi:clock-check-outline
        state: >
          {% set updated = states('sensor.wireguard_telemetry_updated') %}
          {% if updated in ['unknown', 'unavailable', 'none', ''] %}
            Telemetry unavailable
          {% else %}
            {{ updated }}
          {% endif %}

      - name: "ASUS Router Health"
        unique_id: asus_router_health
        icon: mdi:router-wireless
        state: >
          {% set host = states('binary_sensor.asus_gt_be98_router') %}
          {% if host == 'on' %}
            Reachable
          {% else %}
            Unavailable
          {% endif %}
        attributes:
          address: "192.168.100.1"
          model: "GT-BE98"

input_boolean:
  infrastructure_auto_recover_publishers:
    name: Infrastructure Auto-Recover Publishers
    icon: mdi:auto-fix

shell_command:
  infrastructure_check_jellyfin_host: >-
    cat /config/repos/home-assistant-config/infrastructure/tests/check-publisher-deployment-status.sh
    | ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new
    root@192.168.100.96 "bash -s -- --docker-instance jellyfin"

  infrastructure_check_network_services_host: >-
    cat /config/repos/home-assistant-config/infrastructure/tests/check-publisher-deployment-status.sh
    | ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new
    root@192.168.100.99 "bash -s -- --docker-instance pi_hole --check-wireguard"

  infrastructure_refresh_jellyfin_publisher: >-
    ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new
    root@192.168.100.96 "systemctl start docker-health-publisher@jellyfin.service"

  infrastructure_refresh_network_services_publishers: >-
    ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new
    root@192.168.100.99 "systemctl start docker-health-publisher@pi_hole.service wireguard-health-publisher.service"

script:
  infrastructure_run_publisher_deployment_checks:
    alias: Infrastructure - Run Publisher Deployment Checks
    icon: mdi:clipboard-check-outline
    mode: queued
    max: 2
    sequence:
      - action: shell_command.infrastructure_check_jellyfin_host
        continue_on_error: true
      - action: shell_command.infrastructure_check_network_services_host
        continue_on_error: true
      - action: persistent_notification.create
        data:
          notification_id: infrastructure_publisher_checks_requested
          title: "Infrastructure publisher checks requested"
          message: >-
            Requested deployment status checks on 192.168.100.96 and
            192.168.100.99. Review Home Assistant logs for command output and
            host-level failures.

  infrastructure_refresh_publisher_telemetry:
    alias: Infrastructure - Refresh Publisher Telemetry
    icon: mdi:publish
    mode: single
    sequence:
      - action: shell_command.infrastructure_refresh_jellyfin_publisher
        continue_on_error: true
      - action: shell_command.infrastructure_refresh_network_services_publishers
        continue_on_error: true
      - action: persistent_notification.create
        data:
          notification_id: infrastructure_publisher_refresh_requested
          title: "Infrastructure telemetry refresh requested"
          message: >-
            Started one-shot publisher services on 192.168.100.96 and
            192.168.100.99.

automation:
  - id: infrastructure_refresh_publishers_when_telemetry_missing
    alias: Infrastructure - Refresh Publishers When Telemetry Missing
    description: >-
      Runs one-shot publisher services when infrastructure telemetry becomes
      unavailable for sustained periods.
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.jellyfin_runtime
        to: "Telemetry unavailable"
        for: "00:05:00"
      - platform: state
        entity_id: sensor.pi_hole_docker_health
        to: "Telemetry unavailable"
        for: "00:05:00"
      - platform: state
        entity_id: sensor.wireguard_telemetry_status
        to: "Telemetry unavailable"
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_boolean.infrastructure_auto_recover_publishers
        state: "on"
    action:
      - action: script.infrastructure_refresh_publisher_telemetry
