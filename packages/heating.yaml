    initial: 20
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer

  heating_target_first_floor:
    name: Heating Target First Floor
    initial: 20
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:home-floor-1

  heating_target_chris_room:
    name: Heating Target Chris Room
    initial: 20
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:radiator

