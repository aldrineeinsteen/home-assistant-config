    icon: mdi:thermometer-chevron-up

  heating_freezing_cutoff:
    name: Heating Freezing Cutoff
    initial: 6
    min: 2
    max: 7
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake-thermometer

  heating_away_setback_target:
    name: Heating Away Setback Target
    initial: 12
    min: 5
    max: 18
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:home-export-outline

  heating_chris_room_frost_target:
    name: Heating Chris Room Frost Target
    initial: 8
    min: 5
    max: 15
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake-thermometer

  heating_on_margin:
    name: Heating On Temperature Margin
    initial: 0.3
