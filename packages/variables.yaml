input_number:
  heating_target_ground_floor:
    name: Heating Target Ground Floor
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"

  heating_target_first_floor:
    name: Heating Target First Floor
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"

  heating_target_chris_room:
    name: Heating Target Chris Room
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"

  heating_outside_cutoff:
    name: Heating Outside Cutoff
    min: 10
    max: 22
    step: 0.5
    unit_of_measurement: "°C"

  heating_freezing_cutoff:
    name: Heating Freezing Cutoff
    min: 2
    max: 7
    step: 0.5
    unit_of_measurement: "°C"

template:
  - sensor:
      - name: "Electricity Unit Rate"
        unit_of_measurement: "£/kWh"
        state: 0.2058

      - name: "Electricity Standing Charge Daily"
        unit_of_measurement: "£"
        state: 0.4728

      - name: "Gas Unit Rate"
        unit_of_measurement: "£/kWh"
        state: 0.0541

      - name: "Gas Standing Charge Daily"
        unit_of_measurement: "£"
        state: 0.311

      - name: "Electricity Standing Charge Monthly"
        unit_of_measurement: "£"
        state: >
          {{
            (states('sensor.electricity_standing_charge_daily')
            | float(0) * 30) | round(2)
          }}

      - name: "Gas Standing Charge Monthly"
        unit_of_measurement: "£"
        state: >
          {{
            (states('sensor.gas_standing_charge_daily')
            | float(0) * 30) | round(2)
          }}
